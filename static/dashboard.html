<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        border: "hsl(214.3 31.8% 91.4%)",
                        input: "hsl(214.3 31.8% 91.4%)",
                        ring: "hsl(222.2 84% 4.9%)",
                        background: "hsl(0 0% 100%)",
                        foreground: "hsl(222.2 84% 4.9%)",
                        primary: {
                            DEFAULT: "hsl(222.2 47.4% 11.2%)",
                            foreground: "hsl(210 40% 98%)",
                        },
                        secondary: {
                            DEFAULT: "hsl(210 40% 96.1%)",
                            foreground: "hsl(222.2 47.4% 11.2%)",
                        },
                        muted: {
                            DEFAULT: "hsl(210 40% 96.1%)",
                            foreground: "hsl(215.4 16.3% 46.9%)",
                        },
                        accent: {
                            DEFAULT: "hsl(210 40% 96.1%)",
                            foreground: "hsl(222.2 47.4% 11.2%)",
                        },
                        destructive: {
                            DEFAULT: "hsl(0 84.2% 60.2%)",
                            foreground: "hsl(210 40% 98%)",
                        },
                        success: "hsl(142.1 76.2% 36.3%)",
                        chart: {
                            1: "hsl(12 76% 61%)",
                            2: "hsl(173 58% 39%)",
                            3: "hsl(197 37% 24%)",
                            4: "hsl(43 74% 66%)",
                            5: "hsl(27 87% 67%)",
                        },
                    },
                }
            }
        }
    </script>
    <style>
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        .animate-pulse-slow {
            animation: pulse 1.5s ease-in-out infinite;
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        /* Bars scale fade spinner */
        .spinner-bars rect {
            animation: bars-scale-fade 0.75s ease-in-out infinite;
        }
        .spinner-bars rect:nth-child(1) {
            animation-delay: 0s;
        }
        .spinner-bars rect:nth-child(2) {
            animation-delay: 0.15s;
        }
        .spinner-bars rect:nth-child(3) {
            animation-delay: 0.3s;
        }
        @keyframes bars-scale-fade {
            0%, 100% {
                opacity: 1;
                height: 22px;
                y: 1px;
            }
            50% {
                opacity: 0.2;
                height: 14px;
                y: 5px;
            }
        }
        /* Bot icon animations */
        @keyframes bot-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        @keyframes bot-think {
            0%, 100% { transform: rotate(0deg); opacity: 1; }
            25% { transform: rotate(-8deg); opacity: 0.8; }
            75% { transform: rotate(8deg); opacity: 0.8; }
        }
        @keyframes bot-process {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        .bot-icon-generating {
            animation: bot-think 1s ease-in-out infinite;
        }
        .bot-icon-evaluating {
            animation: bot-process 0.6s ease-in-out infinite;
        }
        .bot-icon-active {
            animation: bot-bounce 0.8s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-background p-4 h-screen overflow-hidden font-sans">
    <!-- Connection Status -->
    <div id="connection-status" class="fixed top-4 right-4 px-4 py-2 rounded-full text-xs font-medium bg-destructive text-white">
        Disconnected
    </div>

    <div class="max-w-7xl mx-auto h-full flex flex-col gap-4">
        <!-- Header -->
        <h1 class="text-xl font-semibold text-foreground">Feature Engineering Agent</h1>

        <!-- Status Bar -->
        <div class="flex gap-3">
            <div class="flex-1 bg-card border border-border rounded-lg p-3 hover:border-gray-300 transition-colors">
                <div class="text-[10px] text-muted-foreground uppercase tracking-wider font-medium mb-1">Status</div>
                <div id="status" class="text-lg font-semibold text-muted-foreground">Waiting...</div>
            </div>
            <div class="flex-1 bg-card border border-border rounded-lg p-3 hover:border-gray-300 transition-colors">
                <div class="text-[10px] text-muted-foreground uppercase tracking-wider font-medium mb-1">Elapsed</div>
                <div id="elapsed-time" class="text-lg font-semibold font-mono">00:00</div>
            </div>
            <div class="flex-1 bg-card border border-border rounded-lg p-3 hover:border-gray-300 transition-colors">
                <div class="text-[10px] text-muted-foreground uppercase tracking-wider font-medium mb-1">Iteration</div>
                <div id="iteration" class="text-lg font-semibold">0 / 0</div>
            </div>
            <div class="flex-1 bg-card border border-border rounded-lg p-3 hover:border-gray-300 transition-colors">
                <div class="text-[10px] text-muted-foreground uppercase tracking-wider font-medium mb-1">Features Adopted</div>
                <div id="features-adopted" class="text-lg font-semibold text-success">0</div>
            </div>
            <div class="flex-1 bg-card border border-border rounded-lg p-3 hover:border-gray-300 transition-colors">
                <div class="text-[10px] text-muted-foreground uppercase tracking-wider font-medium mb-1">Success Rate</div>
                <div id="success-rate" class="text-lg font-semibold">--</div>
            </div>
            <div class="flex-1 bg-card border border-border rounded-lg p-3 hover:border-gray-300 transition-colors">
                <div class="text-[10px] text-muted-foreground uppercase tracking-wider font-medium mb-1">Best RMSLE</div>
                <div class="flex items-baseline gap-1">
                    <span id="best-rmsle" class="text-lg font-semibold text-success">--</span>
                    <span id="rmsle-improvement" class="text-xs text-green-500 font-medium"></span>
                </div>
            </div>
        </div>

        <!-- Workers Section -->
        <div id="workers-section" class="hidden">
            <h3 class="text-[10px] text-muted-foreground uppercase tracking-wider font-medium mb-2">Workers</h3>
            <div id="workers-grid" class="grid grid-cols-[repeat(auto-fit,minmax(280px,1fr))] gap-3 max-h-[180px] overflow-y-auto">
                <!-- Workers added dynamically -->
            </div>
        </div>

        <!-- Main Grid -->
        <div class="grid grid-cols-[2fr_1fr] gap-4 flex-1 min-h-0">
            <!-- Chart Container -->
            <div class="bg-card border border-border rounded-xl p-4 flex flex-col min-h-0">
                <canvas id="rmsle-chart" class="flex-1 min-h-0"></canvas>
            </div>

            <!-- Sidebar -->
            <div class="flex flex-col gap-3 min-h-0 overflow-hidden">
                <!-- Producer Status -->
                <div id="producer-status" class="hidden bg-card border border-border rounded-lg p-3">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-chart-1 spinner-bars" id="producer-spinner" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                            <rect width="6" height="14" x="1" y="4"></rect>
                            <rect width="6" height="14" x="9" y="4" opacity="0.4"></rect>
                            <rect width="6" height="14" x="17" y="4" opacity="0.3"></rect>
                        </svg>
                        <i data-lucide="cpu" class="w-4 h-4 text-chart-1" id="producer-icon"></i>
                        <span class="text-[10px] text-muted-foreground uppercase tracking-wider font-medium">Generator</span>
                        <span id="producer-state" class="text-[10px] font-semibold text-muted-foreground ml-auto">Idle</span>
                    </div>
                </div>

                <!-- Queue Panel -->
                <div id="queue-panel" class="hidden bg-card border border-border rounded-lg p-3 max-h-[200px] overflow-y-auto flex-shrink-0">
                    <h3 class="text-[10px] text-muted-foreground uppercase tracking-wider font-medium mb-2">
                        Queue <span id="queue-progress" class="text-muted-foreground/70">(0)</span>
                    </h3>
                    <div id="queue-list" class="flex flex-col gap-1">
                        <!-- Queue items added dynamically -->
                    </div>
                </div>

                <!-- Features Container -->
                <div class="bg-card border border-border rounded-lg p-3 flex-1 min-h-0 max-h-[500px] overflow-y-auto">
                    <h3 class="text-[10px] text-muted-foreground uppercase tracking-wider font-medium mb-2">Recent Features</h3>
                    <div id="features-list">
                        <div class="text-center text-muted-foreground py-12 text-sm">No features yet. Start the agent to see results.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let chart;
        let currentIteration = 0;
        let totalIterations = 0;
        let successCount = 0;
        let totalCount = 0;
        let queuedFeatures = [];
        let baselineRmsle = null;
        let currentBestRmsle = null;
        let pointColors = [];
        let nWorkers = 1;
        let workers = {};
        let timerStartTime = null;
        let timerInterval = null;

        const WORKER_COLORS = ['hsl(12 76% 61%)', 'hsl(221 83% 53%)', 'hsl(262 52% 47%)', 'hsl(142 71% 45%)'];

        function startTimer() {
            timerStartTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
            updateTimer();
        }

        function updateTimer() {
            if (!timerStartTime) return;
            const elapsed = Math.floor((Date.now() - timerStartTime) / 1000);
            const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const secs = (elapsed % 60).toString().padStart(2, '0');
            document.getElementById('elapsed-time').textContent = `${mins}:${secs}`;
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateBestRmsleDisplay(bestRmsle) {
            document.getElementById('best-rmsle').textContent = bestRmsle.toFixed(5);
            if (baselineRmsle && bestRmsle < baselineRmsle) {
                const improvement = baselineRmsle - bestRmsle;
                document.getElementById('rmsle-improvement').textContent = `+${improvement.toFixed(4)}`;
            }
        }

        // Initialize Chart.js
        const ctx = document.getElementById('rmsle-chart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Iteration RMSLE',
                        data: [],
                        borderColor: 'hsl(173 58% 39%)',
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        borderDash: [5, 5],
                        tension: 0,
                        fill: false,
                        pointBackgroundColor: pointColors,
                        pointBorderColor: '#fff',
                        pointRadius: 5,
                        pointHoverRadius: 7,
                    },
                    {
                        label: 'Best RMSLE',
                        data: [],
                        borderColor: 'hsl(12 76% 61%)',
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        tension: 0,
                        fill: false,
                        pointRadius: 0,
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    intersect: false,
                    mode: 'index',
                },
                plugins: {
                    legend: {
                        display: true,
                        position: 'top',
                        align: 'end',
                        labels: {
                            usePointStyle: true,
                            padding: 15,
                            font: {
                                size: 11,
                                weight: '500'
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        grid: {
                            display: false,
                        },
                        ticks: {
                            font: { size: 11 }
                        }
                    },
                    y: {
                        beginAtZero: false,
                        grid: {
                            color: 'hsl(214.3 31.8% 91.4%)',
                            drawBorder: false,
                        },
                        ticks: {
                            font: { size: 11 }
                        }
                    }
                }
            }
        });

        // WebSocket Connection
        let ws;
        function connect() {
            ws = new WebSocket(`ws://${window.location.host}/ws`);

            ws.onopen = () => {
                const statusEl = document.getElementById('connection-status');
                statusEl.textContent = 'Connected';
                statusEl.className = 'fixed top-4 right-4 px-4 py-2 rounded-full text-xs font-medium bg-success text-white';
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleEvent(data);
            };

            ws.onclose = () => {
                const statusEl = document.getElementById('connection-status');
                statusEl.textContent = 'Disconnected';
                statusEl.className = 'fixed top-4 right-4 px-4 py-2 rounded-full text-xs font-medium bg-destructive text-white';
                setTimeout(connect, 2000);
            };

            ws.onerror = () => ws.close();
        }
        connect();

        // Event Handler
        function handleEvent(event) {
            const { event_type, data } = event;
            const workerId = data.worker_id;

            switch (event_type) {
                case 'agent_start':
                    totalIterations = data.total_iterations || 0;
                    baselineRmsle = data.baseline_rmsle || data.current_rmsle;
                    currentBestRmsle = data.current_rmsle || data.baseline_rmsle;
                    successCount = 0;
                    totalCount = 0;
                    pointColors = [];

                    if (data.n_workers && data.n_workers > 1) {
                        initWorkers(data.n_workers);
                    }

                    if (data.batch_size) {
                        updateProducerStatus('idle', 0);
                    }

                    document.getElementById('status').textContent = 'Running';
                    document.getElementById('status').className = 'text-lg font-semibold text-chart-1 animate-pulse-slow';
                    document.getElementById('features-adopted').textContent = '0';
                    document.getElementById('success-rate').textContent = '--';
                    document.getElementById('elapsed-time').textContent = '00:00';
                    startTimer();

                    if (currentBestRmsle) {
                        addRmslePoints('Start', currentBestRmsle, currentBestRmsle, null);
                        updateBestRmsleDisplay(currentBestRmsle);
                    }

                    document.getElementById('features-list').innerHTML = '';
                    queuedFeatures = [];
                    break;

                case 'feature_accepted':
                    successCount++;
                    totalCount++;
                    currentBestRmsle = data.new_rmsle;
                    addRmslePoints(totalCount.toString(), data.new_rmsle, data.new_rmsle, workerId);
                    updateBestRmsleDisplay(data.new_rmsle);
                    document.getElementById('features-adopted').textContent = successCount;
                    addFeature(data, true, workerId);
                    updateSuccessRate();
                    removeFeatureFromQueue(data.code);
                    updateWorker(workerId, 'idle');
                    break;

                case 'feature_rejected':
                    totalCount++;
                    if (data.rmsle && totalCount > 0) {
                        addRmslePoints(totalCount.toString(), data.rmsle, currentBestRmsle, workerId);
                    }
                    addFeature(data, false, workerId);
                    updateSuccessRate();
                    removeFeatureFromQueue(data.code);
                    updateWorker(workerId, 'idle');
                    break;

                case 'iteration_start':
                    currentIteration = Math.max(currentIteration, data.iteration);
                    document.getElementById('iteration').textContent = `${currentIteration} / ${totalIterations}`;
                    updateWorker(workerId, 'generating');
                    break;

                case 'feature_generated':
                    updateWorker(workerId, 'evaluating', data.code);
                    markFeatureActive(data.code, workerId);
                    break;

                case 'producer_status':
                    updateProducerStatus(data.status, data.queue_size || 0, data.batch_size);
                    break;

                case 'batch_generated':
                    queuedFeatures = [...queuedFeatures, ...data.features.map(code => ({
                        code, status: 'pending', workerId: null
                    }))];
                    renderQueueList();
                    break;

                case 'agent_complete':
                    stopTimer();
                    document.getElementById('status').textContent = 'Complete ✓';
                    document.getElementById('status').className = 'text-lg font-semibold text-success';
                    for (let i = 0; i < nWorkers; i++) {
                        updateWorker(i, 'done');
                    }
                    updateProducerStatus('done', 0);
                    queuedFeatures = [];
                    renderQueueList();
                    break;
            }
        }

        function addRmslePoints(label, actualRmsle, bestRmsle, workerId) {
            chart.data.labels.push(label);

            let pointColor = workerId !== null && workerId !== undefined && nWorkers > 1
                ? WORKER_COLORS[workerId % WORKER_COLORS.length]
                : 'hsl(12 76% 61%)';

            pointColors.push(pointColor);
            chart.data.datasets[0].data.push(actualRmsle);
            chart.data.datasets[0].pointBackgroundColor = pointColors;
            chart.data.datasets[1].data.push(bestRmsle);
            chart.update('none');
        }

        function addFeature(data, success, workerId) {
            const list = document.getElementById('features-list');
            const emptyState = list.querySelector('.text-center');
            if (emptyState) emptyState.remove();

            const div = document.createElement('div');
            const borderClass = success ? 'border-l-success' : 'border-l-destructive';
            div.className = `p-3 mb-2 bg-muted rounded-lg border border-transparent ${borderClass} border-l-2 hover:border-gray-200 transition-all`;

            const icon = success ? '✅' : '❌';
            const name = data.columns ? data.columns.join(', ') : 'Unknown';
            const delta = data.improvement
                ? `<span class="text-success text-xs font-semibold">↓ ${Math.abs(data.improvement).toFixed(5)}</span>`
                : '<span class="text-muted-foreground text-xs">No improvement</span>';
            const code = (data.code || '').split('\n').find(l => l.includes("df[")) || data.code?.split('\n')[0] || '';

            const workerBadge = (workerId !== null && workerId !== undefined && nWorkers > 1)
                ? `<span class="px-2 py-0.5 rounded text-[10px] font-semibold mr-2" style="background: ${WORKER_COLORS[workerId % WORKER_COLORS.length]}20; color: ${WORKER_COLORS[workerId % WORKER_COLORS.length]};">W${workerId + 1}</span>`
                : '';

            div.innerHTML = `
                <div class="flex justify-between items-center gap-3">
                    <span class="font-mono text-xs font-medium">${workerBadge}${icon} ${name}</span>
                    ${delta}
                </div>
                <div class="text-muted-foreground text-[10px] font-mono mt-1 truncate">${code}</div>
            `;

            list.insertBefore(div, list.firstChild);
            while (list.children.length > 15) {
                list.removeChild(list.lastChild);
            }
        }

        function updateSuccessRate() {
            const rate = totalCount > 0 ? ((successCount / totalCount) * 100).toFixed(0) : '--';
            document.getElementById('success-rate').textContent = `${rate}%`;
        }

        function initWorkers(n) {
            nWorkers = n;
            workers = {};
            const grid = document.getElementById('workers-grid');
            grid.innerHTML = '';
            document.getElementById('workers-section').classList.remove('hidden');

            for (let i = 0; i < n; i++) {
                workers[i] = { status: 'idle', code: '' };
                const card = createWorkerCard(i);
                grid.appendChild(card);
            }

            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        function createWorkerCard(workerId) {
            const color = WORKER_COLORS[workerId % WORKER_COLORS.length];
            const card = document.createElement('div');
            card.id = `worker-${workerId}`;
            card.className = 'bg-card border-2 border-border rounded-xl p-3 transition-all';
            card.innerHTML = `
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-2 font-semibold text-sm">
                        <svg class="w-5 h-5 spinner-bars" id="worker-spinner-${workerId}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="color: ${color}; display: none;">
                            <rect width="6" height="14" x="1" y="4"></rect>
                            <rect width="6" height="14" x="9" y="4" opacity="0.4"></rect>
                            <rect width="6" height="14" x="17" y="4" opacity="0.3"></rect>
                        </svg>
                        <i data-lucide="bot" class="w-5 h-5" id="worker-icon-${workerId}" style="color: ${color}"></i>
                        Worker ${workerId + 1}
                    </div>
                    <div class="flex items-center gap-1.5">
                        <svg class="w-3 h-3 spinner-bars" id="worker-status-spinner-${workerId}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                            <rect width="6" height="14" x="1" y="4"></rect>
                            <rect width="6" height="14" x="9" y="4" opacity="0.4"></rect>
                            <rect width="6" height="14" x="17" y="4" opacity="0.3"></rect>
                        </svg>
                        <span id="worker-status-${workerId}" class="text-[10px] uppercase tracking-wider text-muted-foreground">Idle</span>
                    </div>
                </div>
                <div id="worker-code-${workerId}" class="bg-muted rounded px-3 py-2 text-[10px] font-mono text-muted-foreground truncate min-h-[32px] flex items-center">
                    Waiting for task...
                </div>
            `;
            return card;
        }

        function updateWorker(workerId, status, code = null) {
            if (workerId === undefined) return;

            const card = document.getElementById(`worker-${workerId}`);
            const statusEl = document.getElementById(`worker-status-${workerId}`);
            const codeEl = document.getElementById(`worker-code-${workerId}`);
            const spinner = document.getElementById(`worker-spinner-${workerId}`);
            const icon = document.getElementById(`worker-icon-${workerId}`);
            const statusSpinner = document.getElementById(`worker-status-spinner-${workerId}`);

            if (!card) return;

            workers[workerId] = { status, code: code || workers[workerId]?.code || '' };

            const color = WORKER_COLORS[workerId % WORKER_COLORS.length];

            if (statusEl) {
                statusEl.textContent = status.charAt(0).toUpperCase() + status.slice(1);
            }

            // Show spinner next to status text when evaluating
            if (statusSpinner) {
                if (status === 'evaluating') {
                    statusSpinner.style.display = 'block';
                    statusSpinner.style.color = color;
                } else {
                    statusSpinner.style.display = 'none';
                }
            }

            // Update icon animation based on status - keep icon visible, hide spinner
            if (spinner) spinner.style.display = 'none';
            if (icon) {
                icon.style.display = 'block';
                icon.className = 'w-5 h-5';
                icon.style.color = color;

                if (status === 'generating') {
                    icon.classList.add('bot-icon-generating');
                } else if (status === 'evaluating') {
                    icon.classList.add('bot-icon-evaluating');
                } else if (status === 'waiting') {
                    icon.classList.add('bot-icon-active');
                }
            }

            if (status === 'idle' || status === 'done') {
                card.className = 'bg-card border-2 border-border rounded-xl p-3 transition-all';
            } else {
                card.className = 'bg-card border-2 rounded-xl p-3 transition-all';
                card.style.borderColor = color;
            }

            if (code && codeEl) {
                const preview = code.split('\n').find(l => l.includes("df[")) || code.split('\n')[0] || '';
                codeEl.textContent = preview;
            }
        }

        function updateProducerStatus(status, queueSize, batchSize = null) {
            const container = document.getElementById('producer-status');
            const stateEl = document.getElementById('producer-state');
            const spinner = document.getElementById('producer-spinner');
            const icon = document.getElementById('producer-icon');

            if (status === 'done') {
                container.classList.add('hidden');
                return;
            }

            container.classList.remove('hidden');

            if (status === 'generating') {
                stateEl.textContent = batchSize ? `Generating ${batchSize}...` : 'Generating...';
                stateEl.className = 'text-[10px] font-semibold text-chart-1 ml-auto';
                if (spinner) spinner.style.display = 'block';
                if (icon) icon.style.display = 'none';
            } else {
                stateEl.textContent = 'Ready';
                stateEl.className = 'text-[10px] font-semibold text-muted-foreground ml-auto';
                if (spinner) spinner.style.display = 'none';
                if (icon) icon.style.display = 'block';
            }

            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        function renderQueueList() {
            const panel = document.getElementById('queue-panel');
            const list = document.getElementById('queue-list');
            const progress = document.getElementById('queue-progress');

            if (queuedFeatures.length > 0) {
                panel.classList.remove('hidden');
            } else {
                panel.classList.add('hidden');
                return;
            }

            const pending = queuedFeatures.filter(f => f.status === 'pending').length;
            progress.textContent = `${pending} waiting`;

            list.innerHTML = queuedFeatures.map(feature => {
                const isActive = feature.status === 'active';
                const color = isActive && feature.workerId !== null ? WORKER_COLORS[feature.workerId % WORKER_COLORS.length] : 'hsl(12 76% 61%)';
                const codePreview = feature.code.match(/df\['([^']+)'\]\s*=/)?.[1] || '...';

                return `
                    <div class="flex items-center gap-2 px-2 py-1.5 bg-muted rounded transition-all ${isActive ? 'border-l-2' : ''}" style="${isActive ? `border-color: ${color}` : ''}">
                        <div class="w-1.5 h-1.5 rounded-full flex-shrink-0 ${isActive ? 'bg-current' : 'border border-current'}" style="${isActive ? `color: ${color}` : ''}"></div>
                        <span class="flex-1 font-mono text-[10px] text-muted-foreground truncate">${codePreview}</span>
                        ${isActive && feature.workerId !== null ? `<span class="px-1.5 py-0.5 rounded text-[9px] font-semibold" style="background: ${color}20; color: ${color};">W${feature.workerId + 1}</span>` : ''}
                    </div>
                `;
            }).join('');
        }

        function markFeatureActive(code, workerId) {
            const feature = queuedFeatures.find(f => f.code === code && f.status === 'pending');
            if (feature) {
                feature.status = 'active';
                feature.workerId = workerId;
                renderQueueList();
            }
        }

        function removeFeatureFromQueue(code) {
            queuedFeatures = queuedFeatures.filter(f => f.code !== code);
            renderQueueList();
        }

        // Initialize Lucide icons
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    </script>
</body>
</html>
